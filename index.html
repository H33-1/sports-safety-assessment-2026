</style><header><span id="progress"></span> · <span id="save">자동 저장 준비</span><div id="error" role="alert"></div></header><div id="notice">작성 중 자동 저장 · 최종 제출 시 답안은 교사에게 전송되고 사진은 교사 Drive에 저장됩니다.</div><main id="app"></main><footer>운동 안전사고 예방 장치 고안하기 · 작성 내용 자동 저장</footer><dialog id="confirm"><h2>최종 제출 확인</h2><p>작성한 답안과 사진을 교사에게 전송합니다. 저장 성공 응답을 받으면 제출이 완료됩니다.</p><p>제출 후에도 수정하고 다시 제출할 수 있습니다.</p><button id="cancel">계속 작성</button><button id="submit">제출 확정</button></dialog><script>

const KEY='science-safety-assessment-v1';let state={values:{},page:0},storageOK=true;try{state=JSON.parse(localStorage.getItem(KEY))||state;if(!state.values)throw Error()}catch(e){state={values:{},page:0}}let v=state.values;const app=document.querySelector('#app'),pages=[];

function add(p,tag,id,x,y,w,h,label,opts={}){let e=document.createElement(tag);e.className='field';e.id=id;e.setAttribute('aria-label',label);pos(e,x,y,w,h);Object.assign(e,opts);pages[p].append(e);return e}
function field(p,id,x,y,w,h,label,type='text',options){let e=add(p,type==='area'?'textarea':type==='select'?'select':'input',id,x,y,w,h,label);if(type==='select'){e.add(new Option('선택',''));options.forEach(o=>e.add(new Option(o,o)))}else if(type!=='area')e.type=type;if(type==='number'){e.min=1;e.inputMode='numeric'}e.value=v[id]||'';e.addEventListener('input',()=>{v[id]=e.value;save();sync()});return e}

for(let i=1;i<=2;i++){let dx=(i-1)*452;field(3,'ideaName'+i,56+dx,805,383,40,'아이디어 '+i+' 이름');field(3,'ideaDesc'+i,56+dx,925,383,158,'아이디어 '+i+' 장치 설명','area');field(3,'ideaCause'+i,56+dx,1165,383,127,'아이디어 '+i+' 줄일 수 있는 원인','area');output(4,'ideaNameEcho'+i,62+dx,665,378,33,'아이디어 이름');output(4,'ideaDescEcho'+i,62+dx,780,378,101,'장치 설명');output(4,'ideaCauseEcho'+i,62+dx,935,378,32,'줄일 수 있는 원인');for(let j=0;j<4;j++){let box=add(4,'div','rating'+i+j,382+(i-1)*274,1120+j*49,155,30,'아이디어 '+i+' '+['효과성','실현 가능성','편리성','경제성'][j]);box.classList.add('stars');for(let s=1;s<=5;s++){let b=document.createElement('button');b.type='button';b.textContent='☆';b.setAttribute('aria-label',s+'점');b.onclick=()=>{v['score'+i+j]=s;save();sync()};box.append(b)}}output(4,'total'+i,365+(i-1)*273,1316,240,38,'아이디어 '+i+' 합계');choice(4,'finalIdea',String(i),53+(i-1)*168,1478,159,44,'아이디어 '+i+' 최종 선택')}
field(4,'finalReason',415,1459,468,63,'최종 아이디어 선택 이유','area');
field(5,'deviceName',52,546,277,38,'장치 이름');field(5,'users',364,546,230,38,'장치 사용자');field(5,'usageSituation',628,546,266,38,'사용 운동 및 상황');let sketch=add(5,'img','sketch',46,686,378,207,'업로드한 장치 스케치');sketch.hidden=true;let upload=add(5,'input','upload',49,859,372,34,'장치 스케치 이미지 업로드',{type:'file',accept:'image/png,image/jpeg,image/webp'});upload.onchange=async()=>{let file=upload.files[0];if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)){alert('PNG, JPG, WebP 이미지를 선택하세요.');return}if(file.size>15000000){alert('15MB 이하 이미지를 선택하세요.');return}try{let bmp=await createImageBitmap(file);let c=document.createElement('canvas');let scale=Math.min(1,900/Math.max(bmp.width,bmp.height));c.width=bmp.width*scale;c.height=bmp.height*scale;c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);let old=v.sketch;v.sketch=c.toDataURL('image/jpeg',.65);if(!save())v.sketch=old;sync();bmp.close()}catch(e){alert('이미지를 읽지 못했습니다. 다른 이미지를 선택하세요.')}};
field(5,'operation',479,716,423,169,'장치 작동 순서','area');[[79,1010],[256,1010],[386,1010],[79,1043],[256,1043],[386,1043]].forEach(([x,y],j)=>check(5,'principle'+j,x,y,['충격량과 충돌 시간','마찰력','센서와 경보','힘과 운동','압력','기타'][j]));field(5,'science',54,1107,460,30,'적용된 과학 원리');field(5,'scienceExplain',535,1015,365,122,'과학 원리가 사고를 줄이는 방법','area');for(let j=0;j<3;j++){field(5,'material'+j,53,1280+j*26,177,20,'재료 '+(j+1));field(5,'materialReason'+j,239,1280+j*26,276,20,'재료 '+(j+1)+' 선택 이유');field(5,'usageStep'+j,610,1257+j*36,285,23,'사용 방법 '+(j+1))}field(5,'limit',55,1452,401,23,'예상되는 한계');field(5,'sideEffect',491,1452,400,23,'불편이나 부작용');field(5,'references',282,1531,609,23,'참고 자료 출처');
for(let p=1;p<=5;p++){let y=p===5?1580:p===4?1561:1537;hit(p,'prev'+p,p===5?199:198,y,p===5?287:245,p===5?65:79,'이전 단계',()=>go(p-1));hit(p,'next'+p,p===5?496:460,y,p===5?248:300,p===5?65:79,p===5?'제출하기':'다음 단계',()=>{if(p===5){if(validateAll())document.querySelector('#confirm').showModal()}else go(p+1,true)})}
['school','grade','class','number','name','submittedAt','status'].forEach((id,i)=>output(6,'receipt'+id,311,703+[0,65,133,204,278,352,429][i],546,i===4||i===5||i===6?66:57,id));hit(6,'edit',213,1252,514,77,'내 답안 확인 및 수정하기',()=>{state.editing=true;save();go(0)});hit(6,'home',268,1471,405,86,'처음 화면으로 돌아가기',()=>go(0));
const required=[['school','grade','class','number','name'],['sport1','accident1','sourceDetail1','sport2','accident2','sourceDetail2','accidentChoice','reasonDetail'],['human','environment','equipment','causeType','coreCause','causeEvidence'],['ideaName1','ideaDesc1','ideaCause1','ideaName2','ideaDesc2','ideaCause2'],['score10','score11','score12','score13','score20','score21','score22','score23','finalIdea','finalReason'],['users','usageSituation','operation','science','scienceExplain','material0','materialReason0','usageStep0','limit','sideEffect','references']];
function validate(p){let missing=(required[p]||[]).find(k=>!String(v[k]||'').trim());if(missing){document.querySelector('#error').textContent='필수 항목을 작성하거나 선택해 주세요.';let el=document.getElementById(missing)||document.querySelector('[data-choice="'+missing+'"]')||document.getElementById(missing.replace('score','rating'));el?.focus();el?.scrollIntoView({block:'center',behavior:'smooth'});return false}return true}
function validateAll(){for(let p=0;p<6;p++){go(p);if(!validate(p))return false}return true}
function go(p,valid=false){if(valid&&!validate(state.page))return;state.page=p;pages.forEach((e,i)=>e.hidden=i!==p);document.querySelector('#progress').textContent=(p+1)+' / 7 · '+['인적사항','사고 찾기','원인 분석','아이디어','아이디어 평가','장치 설계','제출 완료'][p];document.querySelector('#error').textContent='';sync();save();window.scrollTo(0,0)}
function txt(id,text){document.getElementById(id).textContent=text||''}function sync(){let accident=[v['sport'+v.accidentChoice],v['accident'+v.accidentChoice]].filter(Boolean).join(' · ');txt('selectedAccident',accident);txt('accidentEcho',accident);txt('causeEcho',v.coreCause);for(let i=1;i<=2;i++){['Name','Desc','Cause'].forEach(k=>txt('idea'+k+'Echo'+i,v['idea'+k+i]));let sum=0;for(let j=0;j<4;j++){let n=Number(v['score'+i+j]||0);sum+=n;[...document.getElementById('rating'+i+j).children].forEach((b,s)=>{b.classList.toggle('on',s<n);b.textContent=s<n?'★':'☆';b.setAttribute('aria-pressed',s+1===n)})}txt('total'+i,sum+' / 20점')}document.querySelectorAll('[data-choice]').forEach(e=>{let chosen=v[e.dataset.choice]===e.dataset.value;e.classList.toggle('chosen',chosen);e.setAttribute('aria-checked',chosen)});let name=v['ideaName'+v.finalIdea]||'';let device=document.getElementById('deviceName');if(!device.matches(':focus')){device.value=v.deviceName||name}sketch.hidden=!v.sketch;if(v.sketch)sketch.src=v.sketch;['school','grade','class','number','name'].forEach(k=>txt('receipt'+k,v[k]));txt('receiptsubmittedAt',state.submittedAt?fmt(state.submittedAt)+(state.modifiedAt?'\n수정: '+fmt(state.modifiedAt):''):'');txt('receiptstatus',state.editing?'수정 중 · 다시 제출해 주세요':state.submittedAt?'제출 완료 · 교사에게 전송됨':'작성 중')}
function fmt(s){return new Date(s).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})}document.querySelector('#cancel').onclick=()=>document.querySelector('#confirm').close();document.querySelector('#submit').onclick=sendSubmission;go(Math.min(6,Math.max(0,Number(state.page)||0)));

let sending=false;
function uuid(){return crypto.randomUUID()}
function identity(){if(!state.id)state.id=uuid();if(!state.editToken){const b=crypto.getRandomValues(new Uint8Array(32));state.editToken=[...b].map(x=>x.toString(16).padStart(2,'0')).join('')}if(!save())throw Error('저장 공간을 확인해 주세요. 인증 정보가 저장되어야 제출할 수 있습니다.')}
async function sendSubmission(){if(sending)return;if(!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(API_URL)){alert('교사가 제출 서버 연결을 완료해야 합니다. 답안은 기기에 저장되어 있습니다.');return}try{identity();}catch(e){alert(e.message);return}const serialized=JSON.stringify(v);if(!state.pending||state.pending.serialized!==serialized)state.pending={requestId:uuid(),serialized};if(!save())return;const payload={id:state.id,editToken:state.editToken,requestId:state.pending.requestId,values:JSON.parse(serialized)};sending=true;const btn=document.querySelector('#submit'),cancel=document.querySelector('#cancel');btn.disabled=true;cancel.disabled=true;btn.textContent='사진과 답안 전송 중…';let frame=document.createElement('iframe');frame.name='submission_'+payload.requestId;frame.hidden=true;document.body.append(frame);const form=document.createElement('form');form.action=API_URL;form.method='POST';form.target=frame.name;form.hidden=true;const input=document.createElement('input');input.name='payload';input.value=JSON.stringify(payload);form.append(input);document.body.append(form);let timer;const cleanup=()=>{clearTimeout(timer);window.removeEventListener('message',receive);form.remove();frame.remove();sending=false;btn.disabled=false;cancel.disabled=false;btn.textContent='제출 확정'};const receive=event=>{if(!/^https:\/\/([a-zA-Z0-9-]+\.)?script\.googleusercontent\.com$/.test(event.origin)&&event.origin!=='https://script.google.com')return;const data=event.data;if(!data||data.requestId!==payload.requestId)return;if(data.ok!==true){cleanup();alert(data.message||'저장 실패. 다시 제출해 주세요.');return}state.submittedAt=data.submittedAt;state.modifiedAt=data.modifiedAt;state.sketchUrl=data.sketchUrl;state.editing=false;state.pending=null;save();cleanup();document.querySelector('#confirm').close();go(6)};window.addEventListener('message',receive);timer=setTimeout(()=>{cleanup();alert('저장 결과를 확인하지 못했습니다. 답안을 유지했습니다. 다시 제출하면 중복 저장 없이 결과를 확인합니다.')},90000);form.submit()}
